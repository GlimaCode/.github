name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what actually occurred.
      placeholder: |
        Running `node scripts/audit.mjs export.csv` on a file with quoted
        newlines produced N findings; I expected M.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.1.0 or commit sha"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22.6 on Windows 11"
