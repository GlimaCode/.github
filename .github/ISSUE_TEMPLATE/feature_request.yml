name: Feature request
description: Suggest a capability this project doesn't have
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you currently can't?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A rough shape is fine — we'll work out the details together.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
